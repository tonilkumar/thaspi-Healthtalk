<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="healGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#healGrad)"/>

  <!-- Soft inner glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.12"/>

  <!-- Blooming Lotus / Heart Wellness Emblem -->
  <path d="M 256 140 C 230 190 180 230 180 280 C 180 322 214 356 256 356 C 298 356 332 322 332 280 C 332 230 282 190 256 140 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 256 200 C 240 240 210 265 210 295 C 210 320 230 340 256 340 C 282 340 302 320 302 295 C 302 265 272 240 256 200 Z" fill="#DDD6FE"/>
  
  <!-- Side calming petals -->
  <path d="M 170 290 C 130 270 120 230 140 200 C 170 210 195 240 205 275 C 190 285 180 290 170 290 Z" fill="#EDE9FE" opacity="0.9"/>
  <path d="M 342 290 C 382 270 392 230 372 200 C 342 210 317 240 307 275 C 322 285 332 290 342 290 Z" fill="#EDE9FE" opacity="0.9"/>

  <!-- Spark of vitality -->
  <circle cx="256" cy="130" r="18" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <path d="M 256 95 L 260 115 L 280 115 L 264 125 L 270 145 L 256 132 L 242 145 L 248 125 L 232 115 L 252 115 Z" fill="#FEF3C7"/>
</svg>
